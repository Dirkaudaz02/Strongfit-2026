            const [hours, minutes] = timeTarget.split(":").map(Number);

            const warningWindow = 15 * 60 * 1000;
            const timeDiff = eventDate - now;

            if (timeDiff < 0) return "past"; 
            if (timeDiff <= warningWindow) return "warn"; 
            return "future";

            const isFinal = event.type === "final";
            const isCocaCola = event.s.includes("Coca-Cola");
            const hasHeats = event.h && event.h.length > 0;
            const athleteInfo = ATHLETE_DATA[event.c];
            
            let athleteSpecificHeatTime = null;
            if (hasHeats && athleteInfo && athleteInfo.heats) {
                event.h.forEach(heat => {
                    Object.keys(athleteInfo.heats).forEach(key => {
                        if (heat.n.includes(key)) {
                            if(heat.t.includes('-')) athleteSpecificHeatTime = heat.t.split(' - ')[0].trim();
                        }
                    });
                });
            }

            const status = getEventStatus(event.d, event.t, currentTime, athleteSpecificHeatTime);
            
            let statusClass = "";
            let badgeStatus = null;
            
            if (status === "past") statusClass = "status-past";
            else if (status === "warn") {
                statusClass = "status-warn ring-1 ring-yellow-500";
                badgeStatus = html`
                    <div class="absolute -top-2 -right-2 bg-yellow-500 text-black text-[9px] font-black px-2 py-0.5 rounded shadow-lg animate-bounce flex items-center z-10">
                        ${Icons.AlertIcon} CALENTAMIENTO
                    </div>`;
            }

            const cardBgClass = isCocaCola 
                ? "bg-gradient-to-br from-red-950 via-black to-zinc-900 border-red-900/40" 
                : "bg-zinc-900 border-zinc-800";

            const eventId = `${event.d}-${event.c}-${event.t}`;

            return html`
                <div 
                    key=${eventId}
                    class=${`relative rounded-xl overflow-hidden border transition-all duration-300 animate-fadeIn group ${cardBgClass} ${statusClass} ${isFinal ? "ring-1 ring-yellow-500/50 shadow-[0_0_20px_rgba(234,179,8,0.1)]" : "shadow-md"} ${hasHeats ? "cursor-pointer active:scale-[0.98]" : ""}`}
                    onClick=${() => hasHeats && setIsOpen(!isOpen)}
                    role="button"
                    tabIndex="0"
                    aria-expanded=${isOpen}
                    onKeyDown=${(e) => { if(hasHeats && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setIsOpen(!isOpen); } }}
                >
                    ${badgeStatus}
                    <div class=${`absolute left-0 top-0 bottom-0 w-1.5 ${styles.bar} opacity-80`}></div>
                    
                    <div class="p-3.5 pl-5">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class=${`text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-wider border border-white/5 ${styles.bg_badge} ${styles.text_badge}`}>
                                ${event.c.replace(" H", "")}
                            </span>
                            ${isFinal && html`<div class="bg-yellow-900/30 px-2 py-0.5 rounded-full border border-yellow-700/30"><span class="text-[9px] font-black text-yellow-400 uppercase tracking-widest animate-pulse">FINAL</span></div>`}
                        </div>

                        ${athleteInfo && html`
                            <div class=${`flex items-center text-xs font-medium mb-3 opacity-90 ${styles.text}`}>
                                ${Icons.UserIcon}
                                <span class="font-bold tracking-wide">${athleteInfo.names}</span>
                            </div>
                        `}

                        <div class="flex items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-base leading-tight truncate text-white font-military tracking-wide">${event.p}</h3>
                                    ${hasHeats && html`<div class=${`text-zinc-500 transform transition-transform ${isOpen ? "rotate-180" : ""}`}>${Icons.ChevronDown(isOpen)}</div>`}
                                </div>
                                <div class=${`flex items-center text-[10px] font-bold uppercase tracking-wide truncate mt-1 ${isCocaCola ? "text-red-400" : "text-zinc-400"}`}>
                                    ${Icons.MapPinSmall}
                                    <span class="truncate">${event.s}</span>
                                </div>
                            </div>
                            <div class="text-right whitespace-nowrap pl-3 border-l border-white/5">
                                <div class="flex items-center justify-end text-lg font-black tracking-tight text-white font-military">${event.t}</div>
                                <div class="text-zinc-500 text-[9px] font-mono font-bold">${event.te !== "---" ? event.te : ""}</div>
                            </div>
                        </div>

                        ${hasHeats && isOpen && html`
                            <div class="mt-4 pt-3 border-t border-white/5 animate-fadeIn">
                                <div class="grid grid-cols-1 gap-1.5">
                                    ${event.h.map((heat, i) => {
                                        let isAthleteHeat = false;
                                        let displayHeatName = heat.n;
                                        if (athleteInfo && athleteInfo.heats) {
                                            Object.keys(athleteInfo.heats).forEach(key => {
                                                if (heat.n.includes(key)) {
                                                    isAthleteHeat = true;
                                                    displayHeatName = `${heat.n} - ${athleteInfo.heats[key]}`;
                                                }
                                            });
                                        }
                                        return html`
                                            <div key=${i} class=${`flex justify-between items-center px-3 py-2 rounded-md border border-white/5 ${isAthleteHeat ? styles.heat_highlight : 'bg-black/20'}`}>
                                                <span class=${`text-xs font-bold ${isAthleteHeat ? 'text-white' : styles.text_badge}`}>
                                                    ${displayHeatName} ${isAthleteHeat && "🔥"}
                                                </span>
                                                <span class="text-xs font-mono text-white/80">${heat.t}</span>
                                            </div>
                                        `;
                                    })}
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function App() {
            const [selectedCategory, setSelectedCategory] = useState("all");
            const [selectedDay, setSelectedDay] = useState("all");
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const filteredEvents = useMemo(() => {
                return RAW_SCHEDULE.filter(event => 
                    (selectedCategory === "all" || event.c === selectedCategory) &&
                    (selectedDay === "all" || event.d === selectedDay)
                );
            }, [selectedCategory, selectedDay]);

            const eventsByDay = useMemo(() => {
                const grouped = {};
                const daysToShow = selectedDay === "all" ? ["Viernes 30", "Sábado 31", "Domingo 01"] : [selectedDay];
                daysToShow.forEach(day => {
                    const dayEvents = filteredEvents.filter(e => e.d === day);
                    if (dayEvents.length > 0 || selectedDay === day) grouped[day] = dayEvents;
                });
                return grouped;
            }, [filteredEvents, selectedDay]);

            return html`
                <div class="max-w-md mx-auto min-h-screen pb-32 relative flex flex-col font-sans">
                    
                    <header class="px-5 pt-6 pb-6 sticky top-0 z-50 bg-black/95 backdrop-blur-xl border-b border-white/10 shadow-2xl">
                        <!-- ACCESOS RÁPIDOS SUPERIORES -->
                        <div class="grid grid-cols-2 gap-2 mb-6">
                            <a href=${LINKS[1].url} target="_blank" class=${`flex items-center justify-center py-2.5 rounded-lg shadow-lg ${LINKS[1].color} font-bold text-[10px] tracking-wide border-b-2`}>
                                <span class="mr-1">${Icons.Podium}</span> <span>RESULTADOS GRAL</span>
                            </a>
                            <a href=${LINKS[2].url} target="_blank" class=${`flex items-center justify-center py-2.5 rounded-lg shadow-lg ${LINKS[2].color} font-bold text-[10px] tracking-wide border-b-2`}>
                                <span class="mr-1">${Icons.Medal}</span> <span>RESULTADOS MASTER</span>
                            </a>
                        </div>

                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="font-military text-3xl text-white tracking-wider leading-none mb-1">
                                    NACIÓN<br/>
                                    <span class="text-red-600">RANGER</span>
                                </h2>
                                <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-[0.2em] flex items-center gap-1">
                                    <span class="w-1 h-1 bg-red-600 rounded-full inline-block"></span>
                                    StrongFit Games 2026
                                </p>
                            </div>
                        </div>
                        
                        <!-- Filtros Día -->
                        <div class="flex space-x-2 overflow-x-auto hide-scroll pb-3">
                             <button onClick=${() => setSelectedDay("all")} class=${`whitespace-nowrap px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-200 border ${selectedDay === "all" ? "bg-white text-black border-white shadow-lg" : "bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-white"}`}>Todo</button>
                            ${["Viernes 30", "Sábado 31", "Domingo 01"].map(day => html`
                                <button key=${day} onClick=${() => setSelectedDay(day)} class=${`whitespace-nowrap px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-200 border ${selectedDay === day ? "bg-red-600 border-red-500 text-white shadow-[0_0_15px_rgba(220,38,38,0.4)]" : "bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-white"}`}>
                                    ${day.replace("Viernes", "VIE").replace("Sábado", "SÁB").replace("Domingo", "DOM")}
                                </button>
                            `)}
                        </div>

                        <!-- Filtros Atleta -->
                        <div class="flex space-x-2 overflow-x-auto hide-scroll pt-1">
                            <button onClick=${() => setSelectedCategory("all")} class=${`whitespace-nowrap px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wide transition-all border ${selectedCategory === "all" ? "bg-zinc-100 text-black border-white" : "bg-transparent text-zinc-600 border-zinc-800"}`}>Todos</button>
                            ${Object.entries(CATEGORY_STYLES).map(([catName, styles]) => {
                                let btnLabel = ATHLETE_DATA[catName] ? ATHLETE_DATA[catName].names.split(" ")[0] : catName.replace(" H", "");
                                if(catName === "Amateur H") btnLabel = "Pablo & José"; 

                                return html`
                                    <button key=${catName} onClick=${() => setSelectedCategory(catName)} class=${`whitespace-nowrap px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wide transition-all border ${selectedCategory === catName ? styles.btn_active + " shadow-lg scale-105" : styles.btn_inactive}`}>
                                        ${btnLabel}
                                    </button>
                                `;
                            })}
                        </div>
                    </header>

                    <main class="flex-1 p-4 space-y-8">
                        ${Object.entries(eventsByDay).length === 0 
                            ? html`
                                <div class="text-center py-20 opacity-40 flex flex-col items-center">
                                    <div class="text-5xl mb-4 grayscale">🏋️</div>
                                    <p class="text-sm font-medium text-zinc-500">Sin eventos con estos filtros.</p>
                                </div>`
                            : Object.entries(eventsByDay).map(([day, events]) => html`
                                <div key=${day} class="space-y-3">
                                    <div class="flex items-center gap-3 mb-2 px-1">
                                        <div class="h-px flex-1 bg-gradient-to-r from-zinc-800 to-transparent"></div>
                                        <h2 class="text-xs font-black text-zinc-500 uppercase tracking-[0.2em] font-military">${day}</h2>
                                        <div class="h-px flex-1 bg-gradient-to-l from-zinc-800 to-transparent"></div>
                                    </div>
                                    <div class="space-y-3">
                                        ${events.map((event, idx) => html`
                                            <${EventCard} event=${event} styles=${CATEGORY_STYLES[event.c]} currentTime=${currentTime} />
                                        `)}
                                    </div>
                                </div>
                            `)
                        }
                    </main>
                    
                    <footer class="mt-8 px-4 pb-10">
                        <div class="flex items-center gap-2 mb-4 opacity-50">
                            <div class="h-px flex-1 bg-white/20"></div>
                            <span class="text-[10px] uppercase font-bold tracking-widest text-white/50">Enlaces de Interés</span>
                            <div class="h-px flex-1 bg-white/20"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <!-- MAPA COMO PRIMERA OPCIÓN ABAJO -->
                            <a href=${LINKS[0].url} target="_blank" class=${`flex items-center justify-center gap-2 py-3 rounded-xl shadow-lg transition-transform active:scale-95 hover:brightness-110 ${LINKS[0].color}`}>
                                ${Icons[LINKS[0].icon]}
                                <span class="text-xs font-bold uppercase tracking-wide">${LINKS[0].label}</span>
                            </a>
                            
                            ${LINKS.slice(3).map(link => html`
                                <a key=${link.id} href=${link.url} target="_blank" rel="noopener noreferrer" 
                                   class=${`flex items-center justify-center gap-2 py-3 rounded-xl shadow-lg transition-transform active:scale-95 hover:brightness-110 ${link.color} ${link.id === 5 ? 'col-span-2' : ''}`}>
                                    ${Icons[link.icon]}
                                    <span class="text-xs font-bold uppercase tracking-wide">${link.label}</span>
                                </a>
                            `)}
                        </div>
                        <div class="text-center text-[9px] text-zinc-600 font-mono pb-2">
                            OPERACIONES NACIÓN RANGER © 2026
                        </div>
                    </footer>
                </div>
            `;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
